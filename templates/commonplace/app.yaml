# SPDX-License-Identifier: MIT
attribute!: &ht-note-body
  description: "The text of a saved note"
  the: org.honky-tonks.note/body
  as: text
  cardinality: one

concept!: &ht-note
  description: "A thought kept in Commonplace"
  with:
    body: ht-note-body

command!: &ht-keep-note
  with:
    body:
      description: "The note from the composer"
      the: dom.event.current-target.form.elements.note/value
      as: text
    nonce:
      description: "Distinguishes repeated note text"
      the: dom.event/time-stamp
      as: float

rule!:
  assert!: ht-note
  when:
    - assert: ht-keep-note
      where: { this: ?this, body: ?body, nonce: ?nonce }

view!:
  this: ht-note
  show:
    title: Commonplace
    label: "{body}"
    ui: |
      <article class="ht-note-row"><p>{body}</p></article>
    directory: |
      <style>
        .ht-notebook { max-width:720px; margin:32px auto; padding:32px; background:#fffdfa; color:#443c49; font:16px/1.6 Arial,sans-serif; }
        .ht-notebook h1 { font-size:32px; font-weight:500; }
        .ht-notebook textarea { box-sizing:border-box; width:100%; min-height:100px; padding:14px; border:1px solid #e1d8e6; background:#f5f1f6; border-radius:4px; font:inherit; resize:vertical; }
        .ht-notebook button { display:block; margin:12px 0 24px auto; padding:10px 16px; border:1px solid #d8c6e3; background:#e7d5f3; border-radius:4px; font:inherit; cursor:pointer; }
        .ht-note-row { padding:16px 0; border-top:1px solid #e8e1e9; }
        .ht-note-row p { white-space:pre-wrap; overflow-wrap:anywhere; }
      </style>
      <section class="ht-notebook">
        <h1>Commonplace</h1>
        <form>
          <textarea name="note" aria-label="New note" placeholder="Something worth keeping…"></textarea>
          <button type="button" onclick=ht-keep-note>Keep note</button>
        </form>
        <article subject={this}><tonk-display entity={this} model=ht-note></tonk-display></article>
      </section>
