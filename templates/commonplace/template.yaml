schemaVersion: 1
slug: commonplace
name: Commonplace
summary: Keep the thoughts worth coming back to. A small notebook for ideas, observations, and loose ends.
description: |
  Commonplace is a notebook with very little ceremony. Capture a thought in the composer and keep it alongside the rest.
  Each note is its own entity in your space, ready for an agent to read or for another view to reuse. It is a starting point for your own writing tool.
category: Writing
version: 1.0.0
license: MIT
author:
  name: Honky Tonks contributors
  url: null
  contact: null
features:
  - Capture plain-text notes
  - Read all notes in a single directory
  - Distinct entries, even when the text repeats
  - No external accounts, APIs, or JavaScript dependencies
images:
  - file: preview.svg
    alt: Commonplace interface illustration showing a note composer and saved thoughts
    caption: Interface illustration with sample notes; the Tonk host may render it differently.
files:
  - file: app.yaml
    description: Note schema, capture command, rule, and views
  - file: examples.yaml
    description: Two optional example notes
    optional: true
entrypoint: ht-note
compatibility: Tonk CLI 0.6.12 notation and standard library
notes: This starter captures and reads notes. Edit or retract existing notes with the CLI, or extend the views to add editing.

