command!:
  this: tonk:invite
  description: "Mint a repo invite — generates a membership keypair and delegation."
  with:
    marker:
      the: dom.event.current-target.dataset/invite
      as: entity
      cardinality: one
      description: "Per-command marker read from the share form's `data-invite`. Gives\n`tonk:invite` an attribute no other command carries, so a\n`tonk:pause-sync` transient (otherwise an identical {this, time}\nshape) does not also decode as an invite.\n"
    prevent-default:
      the: dom.event.do/prevent-default
      as: text
      cardinality: one
      description: "Stop the form submission from reloading the page"
    time:
      the: xyz.tonk.command.invite/time
      as: float
      cardinality: one
      description: "The activation's timestamp; makes each dispatch distinct so a repeat\nclick reliably re-fires the handler and rotates the credential.\n\nIt used to be accompanied by a marker field read from a\n`data-invite` attribute, whose whole job was to stop a\n`tonk:pause-sync` transient — an identical {this, time} otherwise —\nfrom also decoding as an invite. Each command now owns its\nattribute namespace, so the two are disjoint and the marker is gone.\n"

