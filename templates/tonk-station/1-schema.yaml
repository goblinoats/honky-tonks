  type: "Text"

---
db.meta!:
  this: the:GAmmLroKLTtkHe6rqgyBuUoQNYYetwQpcohhYqFaJ1Zs
  description: |
    What this element is for, in the author's own words — the same
    thing a concept's `description` carries, and required for the
    same reason: an element is read by people and by agents that
    have only the branch to go on, and a tag name alone does not
    say what `<tally-widget>` is meant to do.
    
    It is an ordinary field, but it does reach the entity digest
    along with the methods, so two elements that differ only in
    their description are two different values. That is the right
    reading: the description is part of what the definition says.

