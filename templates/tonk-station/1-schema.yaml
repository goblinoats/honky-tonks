# ---- 01-schema.yaml ----
# Dashboard RC 1: application-only export from dashboard-4/main, 2026-10-04.
# Exported from the live space using Tonk CLI 0.6.17.
# Apply these numbered YAML files in filename order, one Tonk eval at a time.
# No cards, instances, columns, notes, rows/cells, pins, runs, settings, keys,
# memberships, invitations, account identities, or revision history are included.
# Routes, schemas, compiled rule logic, event bindings, views and app code are included.
# Simulation remains uninstalled; its historical schema is retained as in the source.
# Terminal host and Cloudflare setup source are embedded in 04-terminal-setup-schema.yaml
# and 05-terminal-setup-package.yaml. Other external runners are not included.

