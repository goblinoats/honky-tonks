xyz.tonk.view!:
  this: tonk:blob
  ui: |
    <div subject={this}>
      <tonk-component>
        <script type="tonk/module">
          customElements.get("tonk-blob-media") ||
            customElements.define("tonk-blob-media", class extends HTMLElement {
              static observedAttributes = ["entity", "content-type", "name", "with"];
              #objectUrl = null;
              #generation = 0;
              connectedCallback() { this.render(); }
              attributeChangedCallback() { if (this.isConnected) this.render(); }
              disconnectedCallback() { this.#generation++; delete this.dataset.rendered; this.revoke(); }
              revoke() {
                if (this.#objectUrl) {
                  URL.revokeObjectURL(this.#objectUrl);
                  this.#objectUrl = null;
                }
              }
              url() {
                const scope = this.getAttribute("with") || "";
                const entity = this.getAttribute("entity") || "";
                const at = scope.indexOf("@");
                if (at < 1 || !entity || scope.includes("{")) return null;
                return "/api/repository/" + scope.slice(at + 1) +
                  "/branch/" + scope.slice(0, at) + "/blob/" + entity;
              }
              async objectUrl() {
                const url = this.url();
                if (!url) return null;
                const resp = await window.fetch(url);
                if (!resp.ok) return null;
                return URL.createObjectURL(await resp.blob());
              }
              render() {
                const key = [
                  this.getAttribute("with"),
                  this.getAttribute("entity"),
                  this.getAttribute("content-type"),
                  this.getAttribute("name"),
                ].join("|");
                if (this.dataset.rendered === key) return;
                this.dataset.rendered = key;
                this.#generation++;
                const root = this.shadowRoot || this.attachShadow({ mode: "open" });
                const type = this.getAttribute("content-type") || "";
                const name = this.getAttribute("name") || this.getAttribute("entity") || "";
                this.revoke();
                if (type.startsWith("image/")) {
                  root.innerHTML = "<style>img { max-width: 100%; }</style>" +
                    "<img part=\"media\">";
                  root.querySelector("img").alt = name;
                  const generation = this.#generation;
                  this.objectUrl().then((u) => {
                    if (!u) {
                      delete this.dataset.rendered;
                      return;
                    }
                    if (generation !== this.#generation) {
                      URL.revokeObjectURL(u);
                      return;
                    }
                    this.#objectUrl = u;
                    root.querySelector("img").src = u;
                  }).catch(() => { delete this.dataset.rendered; });
                  return;
                }
                root.innerHTML =
                  "<style>" +
                  "[part=card] { display: flex; align-items: center; gap: 0.75rem; " +
                  "padding: 0.75rem 1rem; border: 1px solid #d0d0d0; border-radius: 8px; " +
                  "max-width: 28rem; font-family: system-ui, sans-serif; }" +
                  "[part=name] { flex: 1; overflow-wrap: anywhere; }" +
                  "[part=badge] { font-size: 0.75rem; color: #666; border: 1px solid #ddd; " +
                  "border-radius: 4px; padding: 0.1rem 0.4rem; white-space: nowrap; }" +
                  "[part=action] { cursor: pointer; }" +
                  "</style>" +
                  "<div part=\"card\"><span part=\"name\"></span>" +
                  "<span part=\"badge\"></span>" +
                  "<button part=\"action\" type=\"button\">Download</button></div>";
                root.querySelector("[part=name]").textContent = name;
                root.querySelector("[part=badge]").textContent = type || "file";
                root.querySelector("[part=action]").addEventListener("click", async () => {
                  let u;
                  try {
                    u = await this.objectUrl();
                  } catch {
                    return;
                  }
                  if (!u) return;
                  const a = document.createElement("a");
                  a.href = u;
                  a.download = name;
                  a.click();
                  URL.revokeObjectURL(u);
                });
              }
            });
        </script>
      </tonk-component>
      <tonk-blob-media entity={this} content-type={content-type} name={name} with={dom.host/with}></tonk-blob-media>
    </div>

---
xyz.tonk.view!:
  this: tonk:calendar/event
  ui: |
    <span class="calendar-event-row" data-calendar={calendar} data-key={key} data-event={data}></span>

---
xyz.tonk.view!:
  this: tonk:deck/canvas
  directory: |
    <tonk-display model=deck/canvas entity={this} view=ui />
  ui: |
    <div class="deck-root">
      <style>
        /* IBM Plex Mono (latin, weights 400/700) — self-contained woff2
           inlined as data URIs so the editor font needs no network and
           no bundled file. @font-face is document-global, so it also
           reaches the <tonk-prose> shadow DOM. Regular=400, bold &
           headings(650)=700. Source: Google Fonts latin subset. */
        @font-face {
          font-family: 'IBM Plex Mono';
          font-style: normal;
          font-weight: 400;
          font-display: swap;
          src: url(data:font/woff2;base64,) format('woff2');
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
          font-family: 'IBM Plex Mono';
          font-style: normal;
          font-weight: 700;
          font-display: swap;
          src: url(data:font/woff2;base64,) format('woff2');
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        /* -- design tokens ----------------------------------------------
           A light, quiet productivity surface in the manner of Apple's own
           apps (Notes, Reminders, Finder): a plain grey window, white cards,
           hairline separators, soft shadows and system type. Colour is rare:
           system blue for focus and primary actions, yellow for highlights.
           The --wa-* overrides re-theme every Web Awesome element and in-page
           component inside the deck. */
        /* Tokens live on the root too, so top-layer pieces the deck appends
           to <body> (quick action, live terminal) share them. */
        :root:has(.deck-root), .deck-root {
          --dk-gap: 14px;
          --dk-vgap: 12px;
          --dk-top: 0px; /* the space bar is gone; the explorer sits beside the strip, not above it */
          --dk-ease: cubic-bezier(0.32, 0.72, 0, 1);
          --dk-spring: cubic-bezier(0.2, 0.9, 0.25, 1.15);
          --dk-radius: 10px;
          --dk-radius-lg: 14px;
          --dk-font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
          --dk-mono: 'SF Mono', ui-monospace, 'JetBrains Mono', 'IBM Plex Mono', Menlo, monospace;
    
          --dk-bg: #f2f2f5;
          --dk-ink: #1d1d1f;
          --dk-ink-2: #6e6e73;
          --dk-ink-3: #a1a1a6;
          --dk-card: #ffffff;
          --dk-raised: #ffffff;
          --dk-glass: rgba(246, 246, 248, 0.82);
          --dk-glass-strong: rgba(255, 255, 255, 0.94);
          --dk-glass-blur: blur(20px) saturate(160%);
          --dk-line: rgba(0, 0, 0, 0.07);
          --dk-line-strong: rgba(0, 0, 0, 0.12);
          --dk-hover: rgba(0, 0, 0, 0.04);
          --dk-press: rgba(0, 0, 0, 0.075);
          --dk-highlight: rgba(255, 255, 255, 0);
          --dk-accent: #007aff;
          --dk-accent-ink: #ffffff;
          --dk-accent-soft: rgba(0, 122, 255, 0.12);
          --dk-accent-line: rgba(0, 122, 255, 0.45);
          --dk-select: rgba(0, 0, 0, 0.065);
          --dk-danger: #ff3b30;
          --dk-mark: rgba(255, 214, 10, 0.32);
          --dk-mark-line: rgba(214, 160, 0, 0.6);
          --dk-scrim: rgba(0, 0, 0, 0.14);
          --dk-shadow-card: 0 0 0 0.5px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.05), 0 4px 14px rgba(0, 0, 0, 0.04);
          --dk-shadow-pop: 0 0 0 0.5px rgba(0, 0, 0, 0.08), 0 10px 30px rgba(0, 0, 0, 0.12), 0 24px 60px -20px rgba(0, 0, 0, 0.18);
          --dk-backdrop: none;
          color-scheme: light;
    
          /* Legacy names other components read. */
          --dk-paper: var(--dk-card);
          --dk-line-soft: var(--dk-line);
          --dk-sel: var(--dk-accent);
        }
        .deck-root {
          --wa-color-text-normal: var(--dk-ink);
          --wa-color-text-quiet: var(--dk-ink-2);
          --wa-color-surface-default: var(--dk-card);
          --wa-color-surface-raised: var(--dk-raised);
          --wa-color-surface-lowered: var(--dk-bg);
          --wa-color-surface-border: var(--dk-line);
          --wa-color-neutral-fill-quiet: var(--dk-hover);
          --wa-color-brand-fill-loud: var(--dk-accent);
          --wa-color-focus: var(--dk-accent);
          --wa-font-family-body: var(--dk-font);
          --wa-font-family-heading: var(--dk-font);
          --wa-font-family-code: var(--dk-mono);
          --wa-shadow-s: var(--dk-shadow-card);
          --wa-shadow-l: var(--dk-shadow-pop);
    
          display: flex;
          flex-direction: row;
          /* Pinned to the viewport: a host offset or body margin above
             a 100dvh flow box overflows the page by exactly that much
             and scroll-clips the pill bar. Fixed positioning cannot be
             clipped, and the viewport units below agree with this box. */
          position: fixed;
          inset: 0;
          overflow: hidden;
          font-family: var(--dk-font);
          font-size: 13px;
          line-height: 1.55;
          letter-spacing: -0.003em;
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
          color: var(--dk-ink);
          background: var(--dk-backdrop);
          background-color: var(--dk-bg);
          accent-color: var(--dk-accent);
        }
        /* Dark appearance follows the OS through the host's `.wa-dark` class,
           in Apple's graphite greys: cards sit a step lighter than the window,
           as in Notes and Reminders. color-scheme carries the choice into
           embedded frames (notes, weather, simulation). */
        .wa-dark:has(.deck-root), .wa-dark .deck-root {
          --dk-bg: #161618;
          --dk-ink: #f5f5f7;
          --dk-ink-2: #98989d;
          --dk-ink-3: #636366;
          --dk-card: #232325;
          --dk-raised: #2c2c2e;
          --dk-glass: rgba(34, 34, 36, 0.82);
          --dk-glass-strong: rgba(44, 44, 46, 0.94);
          --dk-line: rgba(255, 255, 255, 0.08);
          --dk-line-strong: rgba(255, 255, 255, 0.14);
          --dk-hover: rgba(255, 255, 255, 0.06);
          --dk-press: rgba(255, 255, 255, 0.1);
          --dk-accent: #0a84ff;
          --dk-accent-soft: rgba(10, 132, 255, 0.22);
          --dk-accent-line: rgba(10, 132, 255, 0.6);
          --dk-select: rgba(255, 255, 255, 0.1);
          --dk-danger: #ff453a;
          --dk-mark: rgba(255, 214, 10, 0.22);
          --dk-mark-line: rgba(255, 214, 10, 0.5);
          --dk-scrim: rgba(0, 0, 0, 0.4);
          --dk-shadow-card: 0 0 0 0.5px rgba(0, 0, 0, 0.5), 0 1px 3px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
          --dk-shadow-pop: 0 0 0 0.5px rgba(0, 0, 0, 0.6), 0 12px 34px rgba(0, 0, 0, 0.45), 0 28px 70px -20px rgba(0, 0, 0, 0.6);
          color-scheme: dark;
        }
        .deck-root ::selection { background: var(--dk-accent-soft); }
        /* The tree and canvas are keyboard surfaces with their own selection
           (active row, focused card), so they draw no outline themselves. */
        .deck-root :focus-visible:where(:not(deck-tree, deck-canvas)) { outline: 2px solid var(--dk-accent-line); outline-offset: 1px; }
        /* Text fields carry their own focus cue (caret, underline or ring). */
        .deck-root input:focus-visible, .deck-root textarea:focus-visible, .deck-root select:focus-visible { outline: none; }
        .deck-data { display: none; }
    
        deck-canvas {
          display: flex;
          flex-direction: column;
          flex: 1;
          min-width: 0;
          min-height: 0;
          position: relative;
          outline: none;
        }
        .dk-bar-flex { flex: 1; }
        .deck-root .dk-icon, .deck-root button svg { display: block; flex: none; }
        .deck-root kbd {
          display: inline-flex; align-items: center; justify-content: center;
          min-width: 18px; height: 18px; box-sizing: border-box;
          padding: 0 5px;
          border: 0.5px solid var(--dk-line-strong);
          border-radius: 5px;
          background: var(--dk-hover);
          box-shadow: inset 0 -1px 0 var(--dk-line);
          color: var(--dk-ink-2);
          font-family: var(--dk-font);
          font-size: 10.5px; font-weight: 500; line-height: 1; white-space: nowrap;
        }
    
        /* -- explorer (deck-tree) ------------------------------------
           A flush, translucent source list down the left edge, like Notes. */
        deck-tree {
          /* The open width. The canvas sizes its columns as if the sidebar
             were open, so hiding or showing it never resizes the cards. */
          --dk-tree-w: 232px;
          flex: none;
          width: var(--dk-tree-w);
          min-width: 0;
          height: 100dvh;
          display: flex;
          flex-direction: column;
          position: relative;
          border-right: 0.5px solid var(--dk-line-strong);
          background: var(--dk-glass);
          -webkit-backdrop-filter: var(--dk-glass-blur);
          backdrop-filter: var(--dk-glass-blur);
          outline: none;
          overflow: hidden;
          transition: width 240ms var(--dk-ease);
        }
        deck-tree.is-collapsed { width: 40px; }
        deck-tree.is-collapsed .dt-head, deck-tree.is-collapsed .dt-list, deck-tree.is-collapsed .dt-foot { display: none; }
        .dt-rail { display: none; }
        deck-tree.is-collapsed .dt-rail {
          display: flex; align-items: flex-start; justify-content: center;
          flex: 1; width: 100%; padding: 12px 0 0;
          border: none; background: transparent;
          color: var(--dk-ink-2);
          font: inherit; cursor: pointer;
          transition: color 120ms ease, background 120ms ease;
        }
        deck-tree.is-collapsed .dt-rail:hover { color: var(--dk-ink); background: var(--dk-hover); }
        .dt-head {
          flex: none; height: 44px;
          display: flex; align-items: center; gap: 2px;
          padding: 0 8px 0 16px;
        }
        .dt-title {
          font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
          color: var(--dk-ink-3);
        }
        .dt-title::first-letter { text-transform: uppercase; }
        .dt-btn {
          flex: none; width: 26px; height: 26px; padding: 0;
          display: inline-flex; align-items: center; justify-content: center;
          font: inherit; line-height: 1;
          border-radius: 7px; border: none;
          background: transparent;
          color: var(--dk-ink-3);
          cursor: pointer; box-sizing: border-box;
          transition: color 120ms ease, background 120ms ease;
        }
        .dt-btn svg, .dt-rail svg { display: block; }
        .dt-btn:hover { color: var(--dk-ink); background: var(--dk-hover); }
        .dt-btn:active { background: var(--dk-press); }
        .dt-hide { margin-left: 2px; }
        .dt-list { flex: 1; min-height: 0; overflow: auto; padding: 2px 8px 10px; scrollbar-width: none; }
        .dt-row {
          display: flex; align-items: center; gap: 8px;
          height: 30px; margin: 1px 0;
          padding: 0 8px 0 calc(10px + var(--dt-depth, 0) * 14px);
          border-radius: 8px;
          font-size: 13px; color: var(--dk-ink-2);
          cursor: pointer; white-space: nowrap; user-select: none;
          transition: background 120ms ease, color 120ms ease;
        }
        .dt-row:hover { background: var(--dk-hover); color: var(--dk-ink); }
        /* Chrome shows selection with a fill, never a border. */
        .dt-row.is-sel { background: var(--dk-hover); }
        .dt-row.is-active, .dt-row.is-active:hover {
          background: var(--dk-select);
          color: var(--dk-ink);
          font-weight: 600;
        }
        .dt-row.is-active .dt-glyph { opacity: 1; }
        .dt-row.is-pending, .dt-row.is-ghost { opacity: 0.6; }
        .dt-folder { color: var(--dk-ink-3); }
        .dt-folder .dt-name { font-weight: 600; font-size: 12px; }
        .dt-glyph { flex: none; width: 12px; height: 12px; display: inline-flex; align-items: center; justify-content: center; color: var(--dk-ink-3); }
        .dt-glyph svg { display: block; transition: transform 160ms var(--dk-ease); }
        .dt-folder[aria-expanded="true"] .dt-glyph svg { transform: rotate(90deg); }
        /* Without folders there is nothing to line up with: drop the empty slot. */
        .dt-list:not(:has(.dt-folder)) .dt-deck .dt-glyph { display: none; }
        .dt-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        /* Inline rename, as in Finder: the name becomes editable in place.
           No border or ring; the caret and the text selection are the cue. */
        .dt-input {
          flex: 1; min-width: 0; height: 22px; margin: 0; padding: 0;
          font: inherit; font-size: 13px; color: var(--dk-ink);
          background: transparent; border: 0; border-radius: 0;
          box-shadow: none; outline: none;
        }
        .dt-folder .dt-input { font-weight: 600; font-size: 12px; }
        .dt-x {
          flex: none;
          display: inline-flex; align-items: center; justify-content: center;
          width: 18px; height: 18px;
          color: var(--dk-ink-2); border-radius: 5px;
          opacity: 0; transition: opacity 120ms ease, background 120ms ease;
        }
        .dt-row:hover .dt-x { opacity: 0.55; }
        .dt-x:hover { opacity: 1; background: var(--dk-press); }
        .dt-empty { padding: 10px 12px; font-size: 12px; color: var(--dk-ink-3); }
        .dt-foot { flex: none; padding: 6px 8px 10px; border-top: 0.5px solid var(--dk-line); }
        .dt-help {
          display: flex; align-items: center; justify-content: space-between; width: 100%;
          height: 30px; padding: 0 8px 0 10px; box-sizing: border-box;
          border: 0; border-radius: 8px; background: transparent;
          font: inherit; font-size: 13px; color: var(--dk-ink-2); cursor: pointer;
          transition: background 120ms ease, color 120ms ease;
        }
        .dt-help:hover { background: var(--dk-hover); color: var(--dk-ink); }
    
        /* -- canvas corner: the ? button ------------------------------ */
        .dk-corner {
          position: absolute; right: 16px; bottom: 16px; z-index: 5;
          display: flex; gap: 8px;
        }
        .dk-helpbtn {
          width: 26px; height: 26px; box-sizing: border-box; padding: 0;
          display: inline-flex; align-items: center; justify-content: center;
          font: inherit; font-size: 12px; font-weight: 500; line-height: 1; border-radius: 50%;
          border: 0.5px solid var(--dk-line-strong);
          background: var(--dk-glass-strong);
          -webkit-backdrop-filter: var(--dk-glass-blur);
          backdrop-filter: var(--dk-glass-blur);
          box-shadow: inset 0 1px 0 var(--dk-highlight), var(--dk-shadow-card);
          color: var(--dk-ink-2);
          cursor: pointer;
          transition: color 120ms ease, transform 160ms var(--dk-spring);
        }
        .dk-helpbtn:hover, .dk-helpbtn.is-open { color: var(--dk-ink); transform: scale(1.06); }
        .dk-reload {
          height: 26px; padding: 0 12px; box-sizing: border-box;
          display: inline-flex; align-items: center;
          font: inherit; font-size: 12px; font-weight: 500; line-height: 1; border-radius: 13px;
          border: 0;
          background: var(--dk-accent); color: var(--dk-accent-ink);
          box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
          cursor: pointer;
        }
        .dk-reload[hidden] { display: none; }
        .dk-reload:hover { filter: brightness(1.08); }
    
        /* -- canvas + strip ---------------------------------------
           The strip is the whole surface below the space bar. Every
           level from here down carries an EXPLICIT height (viewport
           calc, then percentages of it) rather than relying on flexed
           sizes being treated as definite — engines disagree on that,
           and a broken link collapses columns to content height. */
        .dk-canvas {
          flex: none;
          height: calc(100dvh - var(--dk-top));
          position: relative;
          overflow-x: auto;
          overflow-y: hidden;
          scrollbar-width: thin;
          scrollbar-color: var(--dk-line-strong) transparent;
        }
        .dk-canvas::-webkit-scrollbar { height: 8px; }
        .dk-canvas::-webkit-scrollbar-track { background: transparent; }
        .dk-canvas::-webkit-scrollbar-thumb {
          background: var(--dk-line-strong);
          border: 2px solid transparent; background-clip: padding-box;
          border-radius: 4px;
        }
        .dk-strip {
          position: relative;
          display: flex;
          align-items: stretch;
          gap: var(--dk-gap);
          height: 100%;
          width: max-content;
          min-width: 100%;
          padding: 12px 64px 14px 14px;
          box-sizing: border-box;
        }
    
        /* -- columns ---------------------------------------------- */
        .dk-col {
          position: relative;
          flex: none;
          display: flex;
          flex-direction: column;
          height: 100%;
          min-width: 0;
          transition: width 280ms var(--dk-ease);
          animation: dk-in 260ms var(--dk-ease);
        }
        .dk-col.is-resizing { transition: none; }
        .dk-col.is-ghost { opacity: 0.85; }
        .dk-grip {
          position: absolute; top: 0; right: -12px;
          width: 16px; height: 100%;
          display: flex; align-items: center; justify-content: center;
          cursor: col-resize;
          z-index: 3;
          touch-action: none;
        }
        .dk-grip::after {
          content: '';
          width: 4px; height: 36px;
          border-radius: 2px;
          background: var(--dk-line-strong);
          opacity: 0;
          transition: opacity 140ms ease, background 140ms ease, height 200ms var(--dk-ease);
        }
        .dk-col:hover .dk-grip::after { opacity: 1; }
        .dk-grip:hover::after, .dk-col.is-resizing .dk-grip::after {
          opacity: 1;
          height: 64px;
          background: var(--dk-accent);
        }
        .dk-grip-pct {
          position: absolute; top: 50%; right: 18px;
          transform: translateY(-50%);
          font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums;
          color: var(--dk-ink);
          background: var(--dk-glass-strong);
          -webkit-backdrop-filter: var(--dk-glass-blur);
          backdrop-filter: var(--dk-glass-blur);
          border: 0.5px solid var(--dk-line-strong);
          border-radius: 7px;
          box-shadow: var(--dk-shadow-card);
          padding: 3px 7px;
          pointer-events: none;
          white-space: nowrap;
        }
        .dk-coladd, .dk-newcol {
          position: absolute;
          width: 28px; height: 28px; padding: 0;
          display: inline-flex; align-items: center; justify-content: center;
          font: inherit; font-size: 16px; font-weight: 400; line-height: 1; cursor: pointer;
          color: var(--dk-ink-2);
          background: var(--dk-glass-strong);
          -webkit-backdrop-filter: var(--dk-glass-blur);
          backdrop-filter: var(--dk-glass-blur);
          border: 0.5px solid var(--dk-line-strong);
          border-radius: 50%;
          box-shadow: inset 0 1px 0 var(--dk-highlight), var(--dk-shadow-card);
          opacity: 0;
          transition: opacity 160ms ease, color 120ms ease, transform 180ms var(--dk-spring);
          z-index: 4;
        }
        .dk-coladd { bottom: 10px; left: 50%; transform: translateX(-50%); }
        .dk-newcol { top: 50%; right: -46px; transform: translateY(-50%); }
        .dk-col:hover .dk-coladd { opacity: 1; }
        .dk-coladd:hover { color: var(--dk-accent); transform: translateX(-50%) scale(1.08); }
        .dk-col:hover .dk-newcol, .dk-newcol:hover { opacity: 1; }
        .dk-newcol:hover { color: var(--dk-accent); transform: translateY(-50%) scale(1.08); }
    
        /* -- stacks ------------------------------------------------ */
        .dk-stack {
          height: 100%;
          display: flex;
          flex-direction: column;
          gap: var(--dk-vgap);
          overflow-y: auto;
          /* y only: absorb stack-edge overscroll (no chaining into
             whatever scrolls above us) while trackpad deltaX still
             chains out to the strip. */
          overscroll-behavior-y: contain;
          scroll-snap-type: y proximity;
          scrollbar-width: none;
        }
        .dk-stack::-webkit-scrollbar { width: 0; }
    
        /* -- artifact windows --------------------------------------
           White cards with a hairline edge and a soft lift. Focus draws a
           thin system-blue ring rather than inverting. */
        .dk-win {
          flex: none;
          height: calc((100% - var(--dk-vgap)) / 2);
          min-height: 170px;
          scroll-snap-align: start;
          display: flex; flex-direction: column;
          overflow: hidden;
          background: var(--dk-card);
          border: 0.5px solid var(--dk-line);
          border-radius: var(--dk-radius);
          box-shadow: var(--dk-shadow-card);
          animation: dk-in 240ms var(--dk-ease);
          user-select: none;
          cursor: default;
          transition: border-color 160ms ease, box-shadow 200ms ease;
        }
        .dk-win:only-child { height: 100%; }
        .dk-win.is-editing { user-select: text; cursor: auto; }
        .dk-win.is-focused {
          border-color: var(--dk-accent-line);
          box-shadow: 0 0 0 2.5px var(--dk-accent-soft), var(--dk-shadow-card);
        }
        @keyframes dk-in {
          from { opacity: 0; transform: translateY(6px) scale(0.985); }
          to { opacity: 1; transform: none; }
        }
        .dk-win-head {
          display: flex; align-items: center; gap: 8px;
          height: 36px; padding: 0 6px 0 14px; flex: none;
          background: transparent;
          border-bottom: 0.5px solid var(--dk-line);
          transition: background 150ms ease;
        }
        /* The title names the card, so the kind label stays out of the head
           (it remains in the DOM for assistive tech and plug-ins). */
        .dk-kind { display: none; }
        /* The instance's title: the head's main text, click to rename.
           Untitled reads quiet and italic so a real title stands out. */
        .dk-title {
          flex: 0 1 auto; min-width: 0;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
          font-size: 13px; font-weight: 600; letter-spacing: -0.01em;
          color: var(--dk-ink);
          cursor: text; border-radius: 5px; padding: 1px 4px; margin-left: -4px;
          transition: background 120ms ease;
        }
        .dk-title:hover { background: var(--dk-hover); }
        .dk-title.is-untitled { color: var(--dk-ink-3); font-weight: 400; font-style: normal; }
        /* Inline rename: no box, no fill — the text stays where it was,
           sized to what is typed, with a thin underline as the only cue. */
        .dk-title-input {
          width: auto; min-width: 4ch; max-width: 100%; field-sizing: content;
          height: 20px; padding: 0; margin: 0; box-sizing: border-box;
          font: inherit; font-size: 13px; font-weight: 500; font-style: normal;
          color: inherit; caret-color: var(--dk-accent);
          background: transparent;
          border: none; border-bottom: 1px solid var(--dk-accent); border-radius: 0; outline: none;
        }
        /* Base input styles add a focus box; the rename keeps only its underline. */
        .deck-root .dk-title-input:focus, .deck-root .dk-title-input:focus-visible { outline: none; box-shadow: none; }
        .dk-title:has(.dk-title-input) { flex: 0 1 auto; overflow: visible; background: transparent; opacity: 1; }
        /* Editing is shown by the caret and the focus ring; Esc is listed in the
           shortcut sheet. No status text in the head. */
        .dk-edit-hint { display: none; }
        .dk-del {
          width: 24px; height: 24px; padding: 0;
          display: inline-flex; align-items: center; justify-content: center;
          border: none; background: transparent;
          color: var(--dk-ink-3);
          font-size: 15px; line-height: 1; cursor: pointer;
          border-radius: 6px;
          opacity: 0.6;
          transition: opacity 120ms ease, color 120ms ease, background 120ms ease;
        }
        .dk-win:hover .dk-del, .dk-win.is-focused .dk-del { opacity: 1; }
        .dk-del:hover { color: var(--dk-ink); background: var(--dk-hover); }
        .dk-scroll {
          flex: 1; min-height: 0; overflow: auto;
          scrollbar-width: thin; scrollbar-color: var(--dk-line-strong) transparent;
        }
        .dk-inner { padding: 14px 16px 16px; }
        /* Live surfaces (terminal, map, weather, grid, note) fill the card body
           edge to edge. Their kind modules also say so, but their style
           elements sit before this one, so the zero padding is stated here. */
        .dk-inner:is(.dk-inner-term, .dk-inner-map, .dk-inner-weather, .dk-inner-grid, .dk-inner-note) { padding: 0; }
    
        /* -- text artifacts (markdown) ------------------------------
           The body is the note: the inner box stretches to the card so
           a click anywhere in it lands on paper (the card's pointerdown
           puts the caret in), and an empty note is not a one-line sliver. */
        .dk-inner-text {
          min-height: 100%; box-sizing: border-box;
          display: flex; flex-direction: column;
          cursor: text;
        }
        .dk-inner-text .dk-prose, .dk-inner-text .dk-md, .dk-inner-text .dk-md-ta { flex: 1 1 auto; }
        .dk-md { overflow-wrap: anywhere; font-size: 14px; line-height: 1.65; }
        .dk-md p { margin: 0 0 10px; }
        .dk-md code {
          font-family: var(--dk-mono);
          font-size: 0.88em; padding: 0.1em 0.35em; border-radius: 5px;
          background: var(--dk-hover);
          border: 0.5px solid var(--dk-line);
        }
        .dk-md-h1, .dk-md-h2, .dk-md-h3 {
          line-height: 1.25; margin: 14px 0 8px; letter-spacing: -0.02em;
          background: none; padding: 0; color: inherit;
        }
        .dk-md-h1:first-child, .dk-md-h2:first-child, .dk-md-h3:first-child { margin-top: 0; }
        .dk-md-h1 { font-size: 20px; font-weight: 650; }
        .dk-md-h2 { font-size: 16px; font-weight: 600; }
        .dk-md-h3 { font-size: 14px; font-weight: 600; }
        .dk-md-list { margin: 2px 0 10px; padding-left: 20px; }
        ul.dk-md-list { list-style: disc; }
        ol.dk-md-list { list-style: decimal; }
        .dk-md-list li { margin: 2px 0; }
        .dk-md-list li::marker { color: var(--dk-ink-3); }
        .dk-md-empty { color: var(--dk-ink-3); margin: 0; }
        /* -- rich text artifacts (<tonk-prose>) ---------------------
           The element imports nothing from our design system; these
           custom properties are its entire theming contract. */
        .dk-prose {
          display: block;
          --tonk-prose-bg: transparent;
          --tonk-prose-fg: var(--dk-ink);
          --tonk-prose-accent: var(--dk-accent);
          --tonk-prose-marker: var(--dk-ink-3);
          --tonk-prose-code-bg: var(--dk-hover);
          --tonk-prose-font: var(--dk-font);
          --tonk-prose-mono: var(--dk-mono);
          --tonk-prose-max-width: none;
          /* The card already supplies the frame, so the editor host
             carries none of its own: no resting border (the faint
             outline) and no focus ring (the yellow-green box). !important
             reaches past the element's shadow :host / :host(:focus-within)
             rules; the caret and in-content borders keep their vars. */
          border: none !important;
          box-shadow: none !important;
        }
        .dk-md-ta {
          display: block; width: 100%; min-height: 60px;
          border: none; outline: none; background: transparent;
          color: inherit; font: inherit; font-size: 14px; line-height: 1.65; resize: none; padding: 0;
          overflow: hidden; box-sizing: border-box;
        }
    
        .dk-mini {
          margin-top: 6px; height: 26px; padding: 0 10px;
          font: inherit; font-size: 12px; font-weight: 500; cursor: pointer;
          color: var(--dk-ink-2);
          background: transparent; border: none; border-radius: 7px;
          transition: background 120ms ease, color 120ms ease;
        }
        .dk-mini:hover { color: var(--dk-ink); background: var(--dk-hover); }
    
        /* -- rich table artifacts (<tonk-table>) ---------------------
           Unlike <tonk-prose>, the element's border/radius are
           already exposed as its own custom properties (rather than
           hard fixed in its shadow CSS), so zeroing them is enough to
           hand the frame back to the card — no !important escape
           hatch needed. The wrapper turns dk-inner into a flex column
           (dk-win is already one, and .dk-scroll/.dk-win give it a
           definite height — full column height for a lone card, half
           for a stacked pair) so the grid can flex:1 into EXACTLY the
           card body. min-height: 0 is what makes that exact: with
           any floor the element could outgrow the card and overflow
           the tile; at 0 the grid always fits and its OWN scroller
           (which the wheel router latches gestures to) owns all
           vertical overflow, so the tile never does. */
        .dk-inner-table { display: flex; flex-direction: column; height: 100%; padding: 0; }
        .dk-table {
          /* NO display override: the element's :host lays out its own
             formula bar / scroller / tab strip as a flex column, and a
             document-level `display: block` (the .dk-prose pattern)
             would beat that :host rule and break its internal layout —
             the scroller loses its height bound, the grid renders at
             full content height, and the tab strip gets clipped away. */
          flex: 1; min-height: 0;
          --tonk-table-border: transparent;
          --tonk-table-radius: 0;
        }
        .dk-table-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; min-height: 40px; padding: 6px 14px; border-top: 0.5px solid var(--dk-line); font-size: 12px; color: var(--dk-ink-2); }
        .dk-table-selected { min-width: 0; flex: 1 1 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; color: var(--dk-ink); }
        .dk-table-tools label { display: flex; align-items: center; gap: 5px; white-space: nowrap; cursor: pointer; }
        .dk-table-tools label[hidden] { display: none; }
        .dk-table-tools input { margin: 0; }
        .dk-table-link {
          max-width: 16em; height: 26px; padding: 0 8px; font: inherit; color: var(--dk-ink);
          background: var(--dk-hover); border: 0.5px solid var(--dk-line-strong); border-radius: 7px;
        }
        .dk-table-open { border: 0; padding: 0; background: none; color: var(--dk-accent); font: inherit; font-weight: 500; text-decoration: none; cursor: pointer; white-space: nowrap; }
        .dk-table-open:hover { text-decoration: underline; text-underline-offset: 2px; }
        .dk-table-open:disabled { color: var(--dk-ink-3); cursor: default; text-decoration: none; }
        .dk-tbl-locked {
          font-size: 12px;
          color: var(--dk-ink-3);
        }
    
        /* -- table artifacts (fallback grid) -------------------------
           Reached only when <tonk-table> is not registered: a plain
           editable grid over the bare-CSV form of the same content
           string (see csvToGrid/gridToCsv above). */
        .dk-tbl {
          font-size: 12px;
          border: 0.5px solid var(--dk-line-strong);
          border-radius: 8px;
          overflow: hidden;
        }
        .dk-tbl-head {
          display: flex; align-items: stretch;
          border-bottom: 0.5px solid var(--dk-line-strong);
          background: var(--dk-hover);
          color: var(--dk-ink-2);
        }
        .dk-tbl-hc {
          flex: 1; min-width: 0; padding: 6px 8px; font-weight: 600;
          display: flex; align-items: center; gap: 2px;
        }
        .dk-tbl-hc span, .dk-tbl-c span {
          display: block; min-width: 0; overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap;
        }
        .dk-tbl-row {
          display: flex; align-items: center;
          border-bottom: 0.5px solid var(--dk-line);
        }
        .dk-tbl-row:last-child { border-bottom: none; }
        .dk-tbl-row:hover { background: var(--dk-hover); }
        .dk-tbl-c { flex: 1; min-width: 0; padding: 6px 8px; }
        .dk-tbl-hc input, .dk-tbl-c input {
          width: 100%; min-width: 30px;
          border: none; outline: none; background: transparent;
          color: inherit; font: inherit; padding: 0;
        }
        .dk-tbl-hc input { font-weight: 600; }
        .dk-tbl-gut { flex: none; width: 16px; display: flex; justify-content: center; }
        .dk-tbl-x {
          border: none; background: transparent;
          color: var(--dk-ink-3);
          font-size: 11px; line-height: 1; cursor: pointer; padding: 0 1px;
        }
        .dk-tbl-x:hover { color: var(--dk-danger); }
        .dk-tbl-ops { display: flex; gap: 4px; margin-top: 8px; align-items: center; }
        .dk-tbl-ops .dk-mini { margin-top: 0; }
        .dk-tbl-hint { font-size: 11px; color: var(--dk-ink-3); padding-left: 4px; }
    
        /* -- shared: overlays, glass sheets, buttons -------------------- */
        .dk-launch, .dk-confirm, .dk-settings, .dk-helpov {
          position: fixed; inset: 0;
          display: flex; justify-content: center;
          background: var(--dk-scrim);
          -webkit-backdrop-filter: blur(2px);
          backdrop-filter: blur(2px);
          animation: dk-fade 160ms ease;
        }
        .dk-launch-card, .dk-confirm-card, .dk-settings-card, .dk-helpov-card {
          background: var(--dk-glass-strong);
          -webkit-backdrop-filter: var(--dk-glass-blur);
          backdrop-filter: var(--dk-glass-blur);
          border: 0.5px solid var(--dk-line-strong);
          border-radius: var(--dk-radius-lg);
          box-shadow: inset 0 1px 0 var(--dk-highlight), var(--dk-shadow-pop);
          animation: dk-pop 220ms var(--dk-spring);
        }
        @keyframes dk-fade { from { opacity: 0; } to { opacity: 1; } }
        @keyframes dk-pop {
          from { opacity: 0; transform: translateY(-6px) scale(0.98); }
          to { opacity: 1; transform: none; }
        }
        .dk-confirm-cancel, .dk-confirm-del, .dk-settings-cancel, .dk-settings-save,
        .dk-empty-launch, .dk-empty-insert, .dk-setting-show {
          display: inline-flex; align-items: center; justify-content: center; gap: 8px;
          font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
          height: 30px; padding: 0 12px; box-sizing: border-box;
          color: var(--dk-ink);
          background: var(--dk-card);
          border: 0.5px solid var(--dk-line-strong);
          border-radius: 7px;
          box-shadow: 0 0.5px 1.5px rgba(0, 0, 0, 0.08);
          transition: background 120ms ease, border-color 120ms ease, filter 120ms ease, transform 120ms ease;
        }
        .dk-confirm-cancel:hover, .dk-settings-cancel:hover, .dk-empty-insert:hover, .dk-setting-show:hover {
          background: var(--dk-press);
        }
        .dk-confirm-cancel:active, .dk-confirm-del:active, .dk-settings-cancel:active,
        .dk-settings-save:active, .dk-empty-launch:active, .dk-empty-insert:active { transform: scale(0.98); }
        .dk-settings-save, .dk-empty-launch {
          color: var(--dk-accent-ink);
          background: var(--dk-accent);
          border-color: transparent;
          box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
        }
        .dk-settings-save:hover, .dk-empty-launch:hover { filter: brightness(1.08); }
        .dk-settings-save kbd, .dk-empty-launch kbd {
          color: inherit; background: rgba(255, 255, 255, 0.18); border-color: rgba(255, 255, 255, 0.25); box-shadow: none;
        }
        .dk-confirm-del {
          color: #fff; background: var(--dk-danger); border-color: transparent;
          box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
        }
        .dk-confirm-del:hover { filter: brightness(1.08); }
        .dk-confirm-del kbd { color: inherit; background: rgba(255, 255, 255, 0.18); border-color: rgba(255, 255, 255, 0.25); box-shadow: none; }
        .dk-settings-close, .dk-helpov-close, .dk-launch-close {
          width: 26px; height: 26px; padding: 0;
          display: inline-flex; align-items: center; justify-content: center;
          border: none; border-radius: 7px; background: transparent;
          color: var(--dk-ink-3); font-size: 16px; line-height: 1; cursor: pointer;
          transition: background 120ms ease, color 120ms ease;
        }
        .dk-settings-close:hover, .dk-helpov-close:hover, .dk-launch-close:hover { color: var(--dk-ink); background: var(--dk-hover); }
        .dk-kicker, .dk-empty-kick, .dk-launch-scope, .dk-confirm-title {
          font-size: 11px; font-weight: 600; letter-spacing: 0.02em; text-transform: none;
          color: var(--dk-ink-3);
        }
    
        /* -- empty state ------------------------------------------------ */
        .dk-empty {
          position: absolute; inset: 0;
          display: flex; align-items: center; justify-content: center;
          pointer-events: none;
        }
        .dk-empty[hidden] { display: none; }
        .dk-empty-card {
          width: 380px; max-width: 86%; padding: 28px;
          display: flex; flex-direction: column; align-items: flex-start; gap: 14px;
          background: var(--dk-glass-strong);
          -webkit-backdrop-filter: var(--dk-glass-blur);
          backdrop-filter: var(--dk-glass-blur);
          border: 0.5px solid var(--dk-line-strong);
          border-radius: var(--dk-radius-lg);
          box-shadow: inset 0 1px 0 var(--dk-highlight), var(--dk-shadow-pop);
          pointer-events: auto;
          animation: dk-pop 260ms var(--dk-spring);
        }
        .dk-empty-card .dk-empty-kick { font-size: 17px; font-weight: 600; letter-spacing: -0.015em; color: var(--dk-ink); }
        .dk-empty-card p { margin: 0; font-size: 13px; color: var(--dk-ink-2); }
        .dk-empty-insert[hidden] { display: none; }
    
        /* -- quick launcher (command palette) ---------------------------- */
        .dk-launch { z-index: 30; align-items: flex-start; padding-top: 14vh; }
        .dk-launch[hidden] { display: none; }
        .dk-launch-card {
          width: 600px; max-width: 92%;
          display: flex; flex-direction: column;
          overflow: hidden;
        }
        .dk-launch-q {
          height: 54px; padding: 0 20px;
          font: inherit; font-size: 16px; letter-spacing: -0.01em; color: var(--dk-ink);
          background: transparent; border: none; outline: none;
          border-bottom: 0.5px solid var(--dk-line);
        }
        .dk-launch-q::placeholder { color: var(--dk-ink-3); }
        .dk-launch-list { display: flex; flex-direction: column; padding: 6px; max-height: min(56vh, 520px); overflow-y: auto; scrollbar-width: none; }
        .dk-launch-scope { padding: 8px 12px 6px; }
        .dk-launch-scope::first-letter { text-transform: uppercase; }
        .dk-launch-item {
          display: flex; align-items: center; justify-content: flex-start; gap: 12px;
          width: 100%; min-width: 0; height: auto; min-height: 42px; flex: none; box-sizing: border-box; overflow: hidden;
          font: inherit; text-align: left; cursor: pointer;
          padding: 7px 10px;
          color: var(--dk-ink);
          background: none; border: none; border-radius: 9px;
          transition: background 80ms ease;
        }
        .dk-launch-item kbd { flex: none; }
        .dk-launch-item:hover { background: var(--dk-hover); }
        .dk-launch-item.is-sel { background: var(--dk-accent); color: var(--dk-accent-ink); }
        .dk-launch-item.is-sel .dk-launch-hint, .dk-launch-item.is-sel .dk-launch-del { color: rgba(255, 255, 255, 0.82); }
        .dk-launch-g {
          width: 28px; height: 28px; flex: none; box-sizing: border-box;
          display: inline-flex; align-items: center; justify-content: center;
          font-size: 14px;
          color: var(--dk-ink-2);
          border: 0.5px solid var(--dk-line-strong);
          border-radius: 8px;
          background: var(--dk-card);
          box-shadow: 0 0.5px 1.5px rgba(0, 0, 0, 0.08);
        }
        .dk-launch-item.is-sel .dk-launch-g { color: var(--dk-accent); border-color: transparent; }
        /* A long label or hint truncates with an ellipsis; it never pushes
           the row sideways (a <button> centers overflowing content, which
           once hid a whole entry off both edges). */
        .dk-launch-label {
          flex: 0 1 auto; min-width: 0;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
          font-size: 13.5px; font-weight: 500;
        }
        .dk-launch-hint {
          flex: 1 1 auto; min-width: 0;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
          font-size: 12.5px; color: var(--dk-ink-3);
        }
        .dk-launch-none { padding: 16px 12px; font-size: 13px; color: var(--dk-ink-3); }
        .dk-launch-label::first-letter { text-transform: uppercase; }
        /* ⌘I rows: the instance's one-line preview gets the room; the
           kind/age hint and the delete affordance stay out of its way. */
        .dk-launch-inst .dk-launch-label {
          flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
          font-weight: 400;
        }
        .dk-launch-inst .dk-launch-hint { flex: none; }
        .dk-launch-inst.is-placed .dk-launch-g { background: var(--dk-accent-soft); color: var(--dk-accent); border-color: var(--dk-accent-line); }
        /* On the selected (accent) row a placed instance inverts: a translucent
           white tile and a white icon, still distinct from the solid tile of an
           instance that is not on the strip. */
        .dk-launch-inst.is-placed.is-sel .dk-launch-g { background: rgba(255, 255, 255, 0.22); color: var(--dk-accent-ink); border-color: rgba(255, 255, 255, 0.35); box-shadow: none; }
        .dk-launch-del {
          flex: none; font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 6px;
          color: var(--dk-ink-3); opacity: 0; transition: opacity 120ms ease, color 120ms ease, background 120ms ease;
        }
        .dk-launch-item:hover .dk-launch-del, .dk-launch-item.is-sel .dk-launch-del { opacity: 0.8; }
        .dk-launch-del:hover { opacity: 1; color: var(--dk-danger); background: color-mix(in srgb, var(--dk-danger) 12%, transparent); }
        .dk-launch-foot {
          display: flex; gap: 16px;
          padding: 9px 16px;
          font-size: 12px; color: var(--dk-ink-3);
          border-top: 0.5px solid var(--dk-line);
          background: var(--dk-hover);
        }
        .dk-launch-foot span { display: inline-flex; align-items: center; gap: 6px; }
    
        /* -- confirm (delete instance / deck / folder) ------------------- */
        .dk-confirm { z-index: 50; align-items: center; }
        .dk-confirm[hidden] { display: none; }
        /* The sidebar's confirm is a modal <dialog> in the top layer. */
        dialog.dk-confirm { width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; color: inherit; font: inherit; }
        dialog.dk-confirm:not([open]) { display: none; }
        dialog.dk-confirm::backdrop { background: transparent; }
        .deck-root dialog.dk-confirm:focus-visible { outline: none; }
        .dk-confirm-card {
          width: 380px; max-width: 90%;
          padding: 20px 20px 16px;
          display: flex; flex-direction: column; gap: 10px;
        }
        .dk-confirm-title::first-letter { text-transform: uppercase; }
        .dk-confirm-body { margin: 0; font-size: 14px; line-height: 1.5; color: var(--dk-ink); }
        .dk-confirm-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    
        /* -- settings (tokens) ------------------------------------------- */
        .dk-settings { z-index: 45; align-items: center; }
        .dk-settings[hidden] { display: none; }
        .dk-settings-card {
          width: 480px; max-width: 92%;
          display: flex; flex-direction: column;
        }
        .dk-settings-head, .dk-helpov-head {
          display: flex; align-items: center;
          padding: 14px 14px 12px 20px; font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
          border-bottom: 0.5px solid var(--dk-line);
        }
        .dk-settings-head > span:first-child::first-letter, .dk-helpov-head > span:first-child::first-letter { text-transform: uppercase; }
        .dk-settings-body { display: flex; flex-direction: column; gap: 16px; padding: 18px 20px; }
        .dk-setting { display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
        .dk-setting-label { font-weight: 500; font-size: 13px; color: var(--dk-ink); }
        .dk-setting-row { display: flex; gap: 6px; align-items: center; }
        .dk-setting-row input {
          flex: 1; min-width: 0; height: 32px; padding: 0 10px;
          font: inherit; font-size: 12px; font-family: var(--dk-mono);
          color: var(--dk-ink); background: var(--dk-card);
          border: 0.5px solid var(--dk-line-strong); border-radius: 8px; outline: none;
          box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04);
          transition: border-color 120ms ease, box-shadow 120ms ease;
        }
        /* Chrome fields keep their resting look while focused; the caret is the cue. */
        .dk-setting-row input:focus { border-color: var(--dk-line-strong); }
        .dk-setting-show { height: 32px; font-size: 12px; color: var(--dk-ink-2); }
        .dk-setting-hint { color: var(--dk-ink-3); font-size: 12px; line-height: 1.45; }
        .dk-settings-foot {
          display: flex; align-items: center; gap: 8px; padding: 12px 20px 16px;
          border-top: 0.5px solid var(--dk-line);
        }
        .dk-settings-note { flex: 1; font-size: 11px; color: var(--dk-ink-3); line-height: 1.4; }
    
        /* -- help overlay ------------------------------------------------ */
        .dk-helpov { z-index: 40; align-items: center; }
        .dk-helpov[hidden] { display: none; }
        .dk-helpov-card {
          width: 540px; max-width: 92%; max-height: 88%; overflow: auto;
        }
        .dk-helpov-grid {
          padding: 6px 20px 8px;
          display: grid; grid-template-columns: 1fr auto; gap: 0;
          font-size: 13px; align-items: center;
        }
        .dk-helpov-grid h3 {
          grid-column: 1 / -1; margin: 14px 0 4px;
          font-size: 11px; font-weight: 600; letter-spacing: 0.01em; color: var(--dk-ink-3);
        }
        .dk-helpov-grid > span { padding: 5px 0; border-bottom: 0.5px solid var(--dk-line); color: var(--dk-ink); }
        .dk-helpov-grid > span:nth-of-type(even) { display: flex; gap: 3px; justify-content: flex-end; align-items: center; padding-left: 24px; color: var(--dk-ink-3); }
        .dk-helpov-note { margin: 4px 20px 18px; font-size: 12px; line-height: 1.45; color: var(--dk-ink-3); }
    
        @media (prefers-reduced-motion: reduce) {
          .deck-root *, .deck-root *::after { transition: none !important; animation: none !important; }
          .dk-canvas, .dk-stack { scroll-behavior: auto; }
        }
        /* Browsers without backdrop-filter get opaque sheets instead of
           unreadable translucent ones. */
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
          deck-tree, .dk-launch-card, .dk-confirm-card, .dk-settings-card, .dk-helpov-card, .dk-empty-card,
          .dk-helpbtn, .dk-coladd, .dk-newcol, .dk-grip-pct { background: var(--dk-raised); }
        }
        /*__DECK_MOBILE_START__*/
        /* The sidebar actions also serve as the phone's compact navigation bar. */
        .dt-mobile-bar { display: none; }
        .dk-launch-head { display: flex; flex: none; align-items: center; border-bottom: 0.5px solid var(--dk-line); }
        .dk-launch-head .dk-launch-q { flex: 1; min-width: 0; width: 0; border-bottom: none; }
        .dk-launch-head .dk-launch-close { flex: none; margin-right: 12px; }
        
        @media (max-width: 760px), (hover: none) and (pointer: coarse) and (max-width: 1024px) {
          .deck-root { flex-direction: column; height: var(--dk-mobile-height, 100dvh); bottom: auto; }
          .deck-root deck-tree, .deck-root deck-tree.is-collapsed {
            width: 100%; height: auto; flex: none; z-index: 20; margin: 0;
            border: 0; border-bottom: 0.5px solid var(--dk-line-strong); border-radius: 0;
            overflow: visible; transition: none;
            padding-top: env(safe-area-inset-top, 0px);
          }
          .dt-mobile-bar { display: flex; align-items: center; gap: 6px; min-height: 54px; padding: 0 8px; }
          .dt-mobile-bar button {
            display: inline-flex; align-items: center; justify-content: center; gap: 4px;
            min-height: 40px; padding: 0 12px; border: 0.5px solid var(--dk-line-strong);
            border-radius: 10px; background: var(--dk-hover); color: var(--dk-ink);
            box-shadow: inset 0 1px 0 var(--dk-highlight);
            font: inherit; font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer;
          }
          .dt-mobile-bar .dt-mobile-toggle { margin-right: auto; border-color: transparent; }
          .deck-root deck-tree .dt-head, .deck-root deck-tree .dt-list, .deck-root deck-tree .dt-rail, .deck-root deck-tree .dt-foot { display: none; }
          .deck-root deck-tree[data-mobile-open] .dt-head {
            display: flex; position: absolute; top: 100%; left: 0; right: 0;
            height: 48px; background: var(--dk-glass-strong); border-bottom: 0.5px solid var(--dk-line);
            -webkit-backdrop-filter: var(--dk-glass-blur); backdrop-filter: var(--dk-glass-blur);
          }
          .deck-root deck-tree[data-mobile-open] .dt-list {
            display: block; position: absolute; top: calc(100% + 48px); left: 0; right: 0;
            max-height: min(55dvh, 420px); overflow: auto; padding: 6px;
            background: var(--dk-glass-strong); border-bottom: 0.5px solid var(--dk-line-strong); box-shadow: var(--dk-shadow-pop);
            -webkit-backdrop-filter: var(--dk-glass-blur); backdrop-filter: var(--dk-glass-blur);
          }
          .deck-root deck-tree .dt-hide { display: none; }
          .dt-head .dt-btn, .dt-row { min-height: 44px; }
          .dt-head .dt-btn { width: 44px; }
          .dt-row .dt-x { opacity: 1; min-width: 36px; min-height: 36px; }
          .dk-corner { top: auto; bottom: 8px; right: 8px; z-index: 21; }
          .dk-helpbtn { display: none; }
          .dk-reload { min-height: 40px; }
          .deck-root deck-canvas { flex: 1; min-height: 0; width: 100%; }
          /* Nested scrolling as on iOS: a swipe in a card body scrolls the body;
             once the body is at its end, the next swipe carries on into the feed
             (the browser latches each swipe to one scroller, so a single swipe never
             jerks from a document into the next artifact). A body that fits, or the
             card's header, scrolls the feed directly. The feed scrolls freely,
             like Notes or Safari: any snapping (mandatory or proximity) pulled
             short swipes back to the starting card and felt stuck. The next card's
             header peeks below as the way on; tapping it brings that card up. */
          .deck-root .dk-canvas {
            flex: 1; min-height: 0; height: auto; overflow-x: hidden; overflow-y: auto; overscroll-behavior-y: contain;
          }
          .deck-root .dk-strip { --dk-peek: 0px; }
          .deck-root .dk-strip:has(.dk-win ~ .dk-win, .dk-col ~ .dk-col .dk-win) { --dk-peek: 52px; }
          .deck-root .dk-strip {
            width: 100%; min-width: 0; min-height: 100%; height: auto;
            flex-direction: column; gap: 12px; padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
          }
          /* Flatten layout only: keeping the DOM parents preserves live iframe sessions. */
          .deck-root .dk-col, .deck-root .dk-stack { display: contents; }
          .deck-root .dk-grip, .deck-root .dk-coladd, .deck-root .dk-newcol { display: none; }
          .deck-root .dk-win, .deck-root .dk-win:only-child {
            width: 100%; height: calc(var(--dk-mobile-card-height, calc(100dvh - 72px)) - var(--dk-peek, 0px));
            min-height: 240px; box-sizing: border-box; animation: none;
          }
          .dk-win-head { height: 44px; padding-left: 12px; touch-action: pan-y; }
          .dk-del { width: 40px; height: 40px; min-height: 40px; opacity: 1; }
          .dk-scroll { overscroll-behavior-y: auto; }
          .dk-inner-term { padding: 0; box-sizing: border-box; }
          .dk-title-input, .dk-md-ta, .dt-input, .dk-settings-body input { font-size: 16px; }
          .dk-empty-card { box-sizing: border-box; max-width: calc(100% - 32px); padding: 22px; }
          .dk-empty-launch, .dk-empty-insert { min-height: 44px; }
          .dk-empty-card kbd, .dk-launch-item kbd, .dk-launch-foot { display: none; }
          .dk-launch { padding: 12px 0; box-sizing: border-box; }
          .dk-launch-card { width: calc(100% - 24px); max-width: none; max-height: calc(var(--dk-mobile-height, 100dvh) - 24px); }
          .dk-launch-q { font-size: 16px; }
          .dk-launch-head .dk-launch-close { width: 44px; height: 44px; margin-right: 4px; font-size: 22px; }
          .dk-launch-list { min-height: 0; overflow-y: auto; }
          .dk-launch-item { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; grid-template-rows: auto auto; height: auto; min-height: 52px; gap: 4px 10px; padding: 10px; align-content: start; }
          .dk-launch-g { grid-column: 1; grid-row: 1 / span 2; align-self: start; }
          .dk-launch-label { grid-column: 2; grid-row: 1; line-height: 1.4; white-space: normal; overflow-wrap: anywhere; }
          .dk-launch-hint, .dk-launch-inst .dk-launch-hint { grid-column: 2; grid-row: 2; padding: 0; line-height: 1.4; white-space: normal; overflow-wrap: anywhere; }
          .dk-launch-del { grid-column: 3; grid-row: 1 / span 2; opacity: 1; min-height: 36px; display: inline-flex; align-items: center; }
        }
      </style>
    
      <div class="deck-data" hidden>
        <tonk-display model=component></tonk-display>
        <tonk-display model=tonk:deck/space></tonk-display>
        <tonk-display model=tonk:deck/column></tonk-display>
        <tonk-display model=tonk:deck/card></tonk-display>
        <tonk-display model=tonk:deck/node></tonk-display>
        <tonk-display model=tonk:deck/instance></tonk-display>
        <tonk-display model=tonk:deck/instance-title></tonk-display>
        <tonk-display model=tonk:deck/setting></tonk-display>
        <tonk-display model=tonk:identity></tonk-display>
        <tonk-display model=tonk:identity entity=state:self></tonk-display>
      </div>
    
      <deck-tree
        oncreatenode=deck/create-node
        onrenamenode=deck/rename-node
        onmovenode=deck/move-node
        ondeletenode=deck/delete-node></deck-tree>
      <deck-canvas name={name}
        oncreateinstance=deck/create-instance
        onclosecard=deck/close-card
        ondeleteinstance=deck/delete-instance
        onretitleinstance=deck/retitle-instance
        onuntitleinstance=deck/untitle-instance
        oncreatesetting=deck/create-setting
        onupdatesetting=deck/update-setting
        onclearsetting=deck/clear-setting
        oncreatenode=deck/create-node
        onrename=deck/rename
        oncreatespace=deck/create-space
        onrenamespace=deck/rename-space
        ondeletespace=deck/delete-space
        oncreatecolumn=deck/create-column
        onsetcolumnwidth=deck/set-column-width
        ondeletecolumn=deck/delete-column
        oncreatecard=deck/create-card
        oneditcard=deck/edit-card
        onmovecard=deck/move-card
        ondeletecard=deck/delete-card></deck-canvas>
    </div>

