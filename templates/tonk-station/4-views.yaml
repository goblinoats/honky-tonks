  this: did:key:z6MkHjqFEUooGc6qGFhUq1rCiTtzhz4TxBpGvZeWtVEr6zt8
  value: |
    (self, value) => {
      if (self !== self.ownerDocument?.activeElement) self.textContent = value ?? '';
    }

