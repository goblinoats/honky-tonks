# ---- 03-deck-move-command.yaml ----
# Moves are events, not saved requests. Preserve the existing field identities
# and name binding so the installed tree view and move rule keep working.
command!:
  this: concept:BqJe62toVMjBSFLoiYn6iptAaCnP4kzim6xqU2M2fYVW
  description: "Move a deck or folder once; persist its parent and order through the existing move rule."
  with:
    key:
      the: dom.event.detail/deck-node-move-key
      as: text
      cardinality: one
      description: "The key of the tree node to move"
    order:
      the: dom.event.detail/deck-node-move-order
      as: text
      cardinality: one
      description: "The node's new order key among its new siblings"
    parent:
      the: dom.event.detail/deck-node-move-parent
      as: text
      cardinality: one
      description: "The key of the destination folder, or root"
