      else if (edge === 'right') x = vw - rect.width - inset;
      else if (edge === 'top') y = inset;
      else if (edge === 'bottom') y = vh - rect.height - inset;
      return { left: Math.max(inset, x), top: Math.max(inset, y), edge };
    }

