  this: the:H8ZU1sGWVYNfyVLXLCpi4bzXt22zhLEuSPQo6x2UJ25D
  description: |
    The version of the commit that installed this seed. A version, not a revision: a revision includes the tree its commit produces, so a fact inside a commit can never name it, while a version is knowable before the batch is written — which is what lets this record ride the same commit as the claims it describes.
    It is also the record of WHAT the seed installed, since a commit's history lists every claim it wrote.

