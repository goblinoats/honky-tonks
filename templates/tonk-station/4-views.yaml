xyz.tonk.view!:
  this: concept:94UkyFse5uBUWp1u1Zm6x2Ys666rTSh8DdaEFBuoK6vj
  directory: |
    <chat-scope subject={this} thread={key} class="tonkchat">
      <chat-sidebar thread={key} onnewchannel="chat/new-channel"
                    onarchive="chat/archive"></chat-sidebar>
      <div class="tonkchat-main">
      <header class="tonkchat-head">
        <span class="tonkchat-title"></span>
        <tonk-display model="agent/presence"></tonk-display>
      </header>
      <div class="tonkchat-nobody">No agent is listening — messages wait on the branch until one plugs in.</div>
      <chat-controls thread={key}></chat-controls>
      <tonk-display model="session/label"></tonk-display>
      <chat-scroll class="tonkchat-scroll"><tonk-display model="chat/message"></tonk-display><chat-live-turn></chat-live-turn></chat-scroll>
      <button type="button" class="tonkchat-latest" hidden>↓ Jump to latest</button>
      <div class="tonkchat-act"><i></i><i></i><i></i><span>responding…</span></div>
      <chat-activity thread={key}></chat-activity>
      <!-- The handshake rows. Hidden, but it must be a real render: the
           hub's `accept` rows reach the wire as rendered <rtc-sig>
           elements. One mount per surface is harmless — the wire itself
           is a page-wide singleton. -->
      <tonk-display model="rtc/signal"></tonk-display>
      <!-- The caller. The wire publishes its `call` rows by dispatching
           CustomEvent('reply') from this element: only a real view render
           gets onreply wired to the rtc/reply command, and in steady
           state there are ZERO rtc/signal rows to dispatch from — so the
           dispatch surface has to be persistent markup, not a data row.
           One per surface is harmless; the wire uses whichever it finds
           first. -->
      <rtc-sig kind="caller" onreply="rtc/reply"></rtc-sig>
      <!-- Which conversations are archived, same deal: invisible, but a
           real render, so the sidebar can read them off the DOM. -->
      <tonk-display model="chat/archived"></tonk-display>
      <!-- The terminal registry, same deal again: __tonkLive.sessions()
           and the launcher's session list are reads of these rows. -->
      <tonk-display model="term/session"></tonk-display>
      <chat-composer thread={key} onsay="chat/send"></chat-composer>
      </div>
      <style>
        /* Fill the deck card's full-height column and give the transcript a
           real internal scroller. Deck cards ARE full-height (`.dk-scroll`
           is a definite, flex-resolved height), so `height:100%` is right —
           BUT the chain must include the `<tonk-view>` that `<tonk-display>`
           wraps its rendered view in. Miss it (as an earlier build did) and
           `.tonkchat` balloons to full content height, `.tonkchat-scroll`
           never becomes bounded, and nothing scrolls. With the chain
           complete, `.tonkchat-scroll` overflows like `<tonk-table>`'s own
           `.scroller`, so the deck's wheel handler routes to it. Verified in
           the browser: card 894px, scroller 345/1239, composer pinned. */
        .dk-inner-agent { height: 100%; min-height: 0; }
        .dk-inner-agent > chat-scope,
        .dk-inner-agent > chat-scope > tonk-display,
        .dk-inner-agent > chat-scope > tonk-display > tonk-view { display: block; height: 100%; min-height: 0; }
        /* The card is now two columns: the conversation list, and the chat
           itself. Everything below .tonkchat-main is unchanged from the
           single-column build — only the axis above it moved. */
        .tonkchat { display: flex; flex-direction: row; height: 100%; min-height: 0;
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .tonkchat-main { flex: 1; min-width: 0; min-height: 0;
                         display: flex; flex-direction: column; }
        .tonkchat-head { display: none; justify-content: space-between; align-items: center;
                         gap: 8px; padding: 6px 10px; flex: none;
                         border-bottom: 1px solid rgba(125, 125, 125, 0.25); }
        /* The presence chips are hidden — the single header indicator
           (::after, below) replaces them. The rows must still RENDER:
           the caller <rtc-sig> rides each chip, Conversation presence
           and <chat-activity> read the rendered rows, and the scope CSS
           keys off [stale]. display:none keeps all of that working
           (same trick as term-card's chips in 03-components.tonk). */
        .tonkchat-head tonk-display { display: none; }
        /* The conversation sidebar: one row per conversation, newest first,
           each labelled by its own first message. Its scroller is a
           <chat-scroll> for the same reason the transcript's is — the deck
           eats a wheel it doesn't recognise. */
        chat-sidebar { flex: none; width: 214px; min-width: 0; display: flex; flex-direction: column;
                       border-right: 1px solid rgba(125, 125, 125, 0.25); }
        chat-sidebar[folded] { width: 40px; }
        chat-sidebar[folded] .tonkchat-sblist,
        chat-sidebar[folded] .tonkchat-sbnew { display: none; }
        chat-sidebar:not(:defined) { display: none; }
        .tonkchat-sbhead { display: flex; align-items: center; justify-content: space-between;
                           gap: 4px; padding: 6px 7px; flex: none; }
        chat-sidebar[folded] .tonkchat-sbhead { justify-content: center; }
        .tonkchat-sbicon { display: inline-flex; align-items: center; justify-content: center;
                           width: 26px; height: 26px; flex: none; padding: 0; cursor: pointer;
                           border: none; border-radius: 7px; background: transparent;
                           color: inherit; opacity: 0.6; }
        .tonkchat-sbicon:hover { opacity: 1; background: rgba(125, 125, 125, 0.16); }
        .tonkchat-sblist { display: block; flex: 1; min-height: 0; overflow-y: auto;
                           padding: 0 6px 8px; overscroll-behavior: contain; }
        .tonkchat-sbitem { display: flex; align-items: center; border-radius: 8px; margin-bottom: 1px; }
        .tonkchat-sbitem:hover { background: rgba(125, 125, 125, 0.12); }
        .tonkchat-sbitem.is-current { background: rgba(125, 125, 125, 0.2); }
        .tonkchat-sbitem.is-archived .tonkchat-sbopen { opacity: 0.5; font-style: italic; }
        .tonkchat-sbopen { flex: 1; min-width: 0; text-align: left; border: none; cursor: pointer;
                           background: transparent; color: inherit; font: 12px/1.35 inherit;
                           font-family: inherit; padding: 7px 2px 7px 9px;
                           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tonkchat-sbarch { flex: none; display: inline-flex; align-items: center; justify-content: center;
                           width: 24px; height: 24px; margin-right: 3px; padding: 0; border: none;
                           border-radius: 6px; background: transparent; color: inherit;
                           cursor: pointer; opacity: 0; }
        .tonkchat-sbitem:hover .tonkchat-sbarch,
        .tonkchat-sbitem:focus-within .tonkchat-sbarch { opacity: 0.55; }
        .tonkchat-sbarch:hover { opacity: 1; background: rgba(125, 125, 125, 0.22); }
        .tonkchat-sbarch:disabled { opacity: 0.3; cursor: default; background: transparent; }
        .tonkchat-sbempty { padding: 8px 9px; font-size: 11.5px; opacity: 0.5; font-style: italic; }
        /* With the list folded away nothing else says which conversation
           this is, so the header carries the title — and only then. */
        .tonkchat-title { display: none; min-width: 0; font-size: 12px; opacity: 0.75;
                          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        chat-sidebar[folded] + .tonkchat-main .tonkchat-title { display: block; }
        /* Archived rows are rendered to be read, not seen. */
        .tonkchat-archive-mount, chat-archived { display: none !important; }
        /* The terminal registry rows too. */
        .tonkterm-registry-mount, term-session { display: none !important; }
        /* Retired: the header indicator carries "nothing is listening"
           now. The element stays in the markup — the scope CSS still
           targets it, and hiding beats re-minting every thread scope. */
        .tonkchat-nobody { display: none; }
        /* The handshake mount renders nothing. */
        .tonkchat-wire-mount, rtc-sig { display: none !important; }
        /* ONE connection indicator, top right, text only. Four states:
             connected            — datachannel up (html[data-tonk-wire],
                                    set by the wire singleton)
             connecting…          — a dial is in flight
             can't connect        — a fresh chip says an agent listens on
                                    THIS thread, but no direct link; that
                                    rule lives in the chat-scope CSS
                                    (03-components.tonk) — only it knows
                                    the thread token
             nothing is listening — no fresh chip, no link (base case)
           margin-left:auto pins it right whether or not the folded-mode
           title is showing. */
        .tonkchat-head::after { content: 'nothing is listening'; margin-left: auto;
          font-size: 10.5px; letter-spacing: 0.02em; opacity: 0.5; white-space: nowrap; }
        html[data-tonk-wire="connecting"] .tonkchat-head::after { content: 'connecting…'; }
        html[data-tonk-wire="live"] .tonkchat-head::after { content: 'connected'; opacity: 0.7; }
        .tonkchat-scroll { display: block; flex: 1; min-height: 0; overflow-y: auto; padding: 8px 0;
                           overscroll-behavior: contain; }
        chat-scroll:not(:defined) { display: block; }
        .tonkchat-scroll > tonk-display, .tonkchat-scroll > chat-live-turn { display: block; }
        .tonkchat-latest { align-self: center; flex: none; margin: 3px 0; padding: 5px 12px; border: 1px solid #8884; border-radius: 16px; background: #252525; color: inherit; font: 11px inherit; cursor: pointer; }
        .tonkchat-latest[hidden] { display: none; }
        /* The transcript: a normal top-to-bottom flex column whose direct
           children are the <chat-msg> rows, so each row's own `order`
           sorts it — no display:contents promotion to depend on. */
        .tonkchat-feed { display: flex; flex-direction: column; }
        /* "responding…" indicator, revealed by <chat-activity> when a live
           listener has an unanswered user message. Derived in the browser,
           so it shows at once rather than waiting on the agent's next push. */
        .tonkchat-act { display: none !important; align-items: center; gap: 4px; flex: none;
                        padding: 2px 16px 6px; font-size: 11.5px; opacity: 0.65; font-style: italic; }
        .tonkchat.tonkchat-pending .tonkchat-act { display: flex; }
        chat-activity { display: none; }
        .tonkchat-act span { margin-left: 4px; }
        .tonkchat-act i { width: 5px; height: 5px; border-radius: 50%; background: currentColor;
                          animation: tonkchat-bounce 1.2s infinite ease-in-out both; }
        .tonkchat-act i:nth-child(2) { animation-delay: 0.16s; }
        .tonkchat-act i:nth-child(3) { animation-delay: 0.32s; }
        @keyframes tonkchat-bounce { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
                                     40% { opacity: 1; transform: translateY(-3px); } }
        .tonkchat-row { display: flex; gap: 6px; align-items: flex-end; padding: 8px 10px; }
        .tonkchat-ta { flex: 1; resize: none; border: 1px solid rgba(125, 125, 125, 0.35);
                       border-radius: 13px; padding: 7px 11px; font: 13px/1.4 inherit;
                       font-family: inherit; background: transparent; color: inherit;
                       max-height: 120px; outline: none; }
        .tonkchat-ta:focus { border-color: #3b82f6; }
        .tonkchat-send { flex: none; width: 30px; height: 30px; border-radius: 50%; border: none;
                         background: #3b82f6; color: #fff; font-size: 15px; cursor: pointer; }
        .tonkchat-send:disabled { opacity: 0.4; cursor: default; }
        chat-msg:not(:defined), agent-presence:not(:defined), chat-composer:not(:defined) { display: none; }
      </style>
    </chat-scope>

