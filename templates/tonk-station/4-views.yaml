---
xyz.tonk.element.method!:
  this: did:key:z6MkE6VktLWLQLuZ4z7ryYN5TWsHkNeTUeevvk3XPJbr8QL6
  connected: |
    (self) => {
      if (!self.__retry) {
        self.__retry = () => self.mount();
        self.addEventListener('tonk:join-retry', self.__retry);
      }
      let fired = false;
      const fire = () => {
        if (fired || !self.ready()) return;
        fired = true;
        self.mount();
      };
