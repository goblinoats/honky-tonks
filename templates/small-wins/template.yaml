schemaVersion: 1
slug: small-wins
name: Small Wins
summary: Give the little things a little credit. A simple counter for practice, progress, and showing up.
description: |
  Small Wins gives you a named counter and a button to move it forward. Use it for pages read, practice sessions, or any small effort you want to notice.
  The counter is stored in your Tonk space. A click becomes a command, and a rule adds one to the current value.
category: Personal
version: 1.0.0
license: MIT
author:
  name: Honky Tonks contributors
  url: null
  contact: null
features:
  - One-click increments
  - A named counter starting at zero
  - Progress stored as a typed integer in your space
  - A compact example of Tonk's reactive rules
images:
  - file: preview.svg
    alt: Small Wins interface illustration showing seven wins and an increment button
    caption: Interface illustration at seven wins. A new installation starts at zero.
files:
  - file: app.yaml
    description: Counter schema, increment command, rule, views, and initial counter
entrypoint: ht-win
compatibility: Tonk CLI 0.6.12 notation and standard library
notes: The initial counter is named ht-reading. Re-evaluating the whole app resets its count to zero; install once and use the button thereafter.

