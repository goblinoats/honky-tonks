          file-tree.is-collapsed .dt-rail { padding-top: 32px; }
          .dt-head { padding: 6px 8px 6px 16px; }
          .dt-search { background: var(--dk-card); border: 1px solid var(--dk-line); margin: 0 8px 4px; }
          .dt-search:hover { background: var(--dk-card); border-color: var(--dk-line-strong); color: var(--dk-ink-3); }
          /* No section label above the tree: the list starts after a small gap. */
          .dt-list { padding-top: 8px; }
          .dt-row { color: var(--dk-ink-2); }
