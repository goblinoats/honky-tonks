          .dp-pill.is-on, .wa-dark .dp-pill.is-on {
            background: var(--dk-card); color: var(--dk-ink); font-weight: 500;
            border-color: var(--dk-line); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
