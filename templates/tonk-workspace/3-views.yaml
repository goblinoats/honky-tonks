            color: var(--dk-ink); font-weight: 500;
          }
          .dt-row.is-active .dt-glyph { color: var(--dk-ink-2); }

          /* Tiles: hairline cards on the canvas, also when only one is open. */
          .dp-strip { padding: 12px 12px 12px 32px; box-sizing: border-box; background: var(--dk-bg); }
          doc-pane.is-multi .dp-strip { padding: 12px 0 12px 32px; background: var(--dk-bg); }
          /* The gap beside the sidebar closes with it: the collapsed rail is
             already the margin. It eases in step with the sidebar's width. */
          .dp-strip { transition: padding-left 240ms var(--dk-ease); }
          file-tree.is-collapsed ~ doc-pane .dp-strip { padding-left: 0; }
          doc-tile, doc-pane.is-multi doc-tile {
