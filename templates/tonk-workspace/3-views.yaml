            doc-pane.is-multi .dp-strip {
              gap: 0; padding: 8px 0; overflow-x: auto; overflow-y: hidden;
              scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none;
            }
            doc-pane.is-multi .dp-strip::-webkit-scrollbar { display: none; }
            doc-pane.is-multi doc-tile, doc-pane.is-multi doc-tile[data-width] {
              flex: 0 0 calc(100% - 16px); width: auto; min-width: 0; margin: 0 8px;
              scroll-snap-align: center; scroll-snap-stop: always;
            }
            doc-pane.is-multi .dp-grip { display: none; }
            doc-pane.is-multi .dp-dots { display: flex; }
            .dp-head { padding: 10px 16px 11px; grid-template-columns: minmax(0, 1fr) auto; row-gap: 10px; }
            .dp-end { grid-column: 2; grid-row: 1; }
            .dp-types, .dp-versions, .dp-version-of { grid-column: 1 / -1; grid-row: 2; justify-self: start; max-width: 100%; }
            .dp-types { flex-wrap: wrap; row-gap: 6px; }
          }
        </style>

