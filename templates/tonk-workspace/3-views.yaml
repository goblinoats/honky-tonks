          doc-pane.is-multi .dp-grip:hover::after, doc-pane.is-multi .dp-grip.is-resizing::after { background: var(--dk-accent-line); }
          .dp-grip-pct { background: var(--dk-card); -webkit-backdrop-filter: none; backdrop-filter: none; border: 1px solid var(--dk-line); box-shadow: var(--dk-shadow-pop); font-family: var(--dk-mono); }

          /* The tile bar. */
          .dp-head { border-bottom: 1px solid var(--dk-line); }
          .dp-path { font-family: var(--dk-mono); font-size: 12px; color: var(--dk-ink-3); }
          /* Breadcrumb parts reveal their folder in the sidebar. */
          .dp-crumb { border: 0; padding: 0; margin: 0; background: none; height: auto; min-height: 0; font: inherit; color: inherit; cursor: pointer; border-radius: 3px; }
          .dp-crumb:hover { color: var(--dk-ink); text-decoration: underline; text-underline-offset: 2px; }
          .dp-tool, .dp-link {
            width: 28px; height: 28px; border: 1px solid var(--dk-line); border-radius: 7px;
            background: var(--dk-card); color: var(--dk-ink-2);
          }
