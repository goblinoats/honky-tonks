          .dp-count { height: 18px; line-height: 16px; border-radius: 4px; border: 1px solid var(--dk-line); background: var(--dk-card); font-family: var(--dk-mono); font-size: 11px; }
          .dp-version-of { font-family: var(--dk-mono); font-size: 11.5px; }
          .dp-menu {
            background: var(--dk-card); -webkit-backdrop-filter: none; backdrop-filter: none;
            border: 1px solid var(--dk-line); border-radius: var(--dk-radius-lg); box-shadow: var(--dk-shadow-pop);
          }
          .dp-menu-head { border-bottom: 1px solid var(--dk-line); padding: 10px 10px 10px 16px; }
          .dp-ver:hover { background: var(--dk-soft); }
          .dp-thumb { border-radius: 4px; box-shadow: 0 0 0 1px var(--dk-line); }
          .dp-ver-meta { font-family: var(--dk-mono); }
          .dp-field input, .dp-field textarea { background: var(--dk-soft); box-shadow: inset 0 0 0 1px var(--dk-line); }
          .dp-field input:focus, .dp-field textarea:focus { box-shadow: inset 0 0 0 1.5px var(--dk-accent-line); }

          /* Primary actions are ink; one per view. */
          .dp-commit, .dp-commit-go, .dp-copy-prompt, .dp-new, .ws-update button {
            background: var(--dk-primary); color: var(--dk-primary-ink); box-shadow: none; filter: none;
          }
          .dp-commit:hover, .dp-commit-go:hover, .dp-copy-prompt:hover, .dp-new:hover, .ws-update button:hover {
            filter: none; background: color-mix(in oklab, var(--dk-primary) 85%, var(--dk-bg));
          }
          .ws-update { background: var(--dk-card); border: 1px solid var(--dk-line); -webkit-backdrop-filter: none; backdrop-filter: none; }

          /* The empty HTML document. */
          .dp-placeholder .dp-empty-icon {
            width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-bottom: 4px;
            border-radius: 10px; border: 1px solid var(--dk-line); background: var(--dk-soft); color: var(--dk-ink-2);
          }
          .dp-placeholder .dp-empty-icon svg { width: 20px; height: 20px; }
          .dp-ph-note { font-family: var(--dk-mono); font-size: 11px; }

          /* Dialogs: solid cards; destructive is an outlined button with red text. */
          .dk-confirm-card { background: var(--dk-card); -webkit-backdrop-filter: none; backdrop-filter: none; border: 1px solid var(--dk-line); box-shadow: var(--dk-shadow-pop); }
          .dk-confirm-del { background: var(--dk-card); color: var(--dk-danger); border: 1px solid var(--dk-line); box-shadow: none; }
          .dk-confirm-del:hover { filter: none; background: color-mix(in oklab, var(--dk-danger) 8%, var(--dk-card)); }
          .dk-confirm-cancel { border: 1px solid var(--dk-line); box-shadow: none; }

          /* Quick open: neutral selection, monospace paths. */
          .dk-launch-card { background: var(--dk-card); border: 1px solid var(--dk-line); }
          .dk-launch-item.is-sel { background: var(--dk-select); color: var(--dk-ink); }
          .dk-launch-item.is-sel .dk-launch-hint { color: var(--dk-ink-3); }
          .dk-launch-g, .dk-launch-item.is-sel .dk-launch-g { color: var(--dk-ink-2); border: 1px solid var(--dk-line); box-shadow: none; background: var(--dk-card); }
          .dk-launch-hint { font-family: var(--dk-mono); font-size: 11.5px; }
          .dk-launch-foot { background: var(--dk-soft); border-top: 1px solid var(--dk-line); }

          /* Narrow tiles: the switcher may wrap inside its outline. */
          @container tile (max-width: 720px) {
            .dp-seg { flex-wrap: wrap; }
          }
          @media (max-width: 760px), (hover: none) and (pointer: coarse) and (max-width: 1024px) {
            .dp-strip, doc-pane.is-multi .dp-strip, file-tree.is-collapsed ~ doc-pane .dp-strip { padding: 8px; }
          }

          /* -- phone ---------------------------------------------------------
             The sidebar becomes a compact bar on top; its list drops down. */
          .dt-mobile-bar { display: none; }
          @media (max-width: 760px), (hover: none) and (pointer: coarse) and (max-width: 1024px) {
            .deck-root { flex-direction: column; height: var(--dk-mobile-height, 100dvh); bottom: auto; }
            .deck-root file-tree, .deck-root file-tree.is-collapsed {
              width: 100%; height: auto; flex: none; z-index: 20; margin: 0;
              border: 0; border-bottom: 0.5px solid var(--dk-line-strong); border-radius: 0;
              overflow: visible; transition: none;
              padding: env(safe-area-inset-top, 0px) 0 0;
            }
            .dt-mobile-bar { display: flex; align-items: center; gap: 6px; min-height: 54px; padding: 0 8px; }
            .dt-mobile-bar button {
              display: inline-flex; align-items: center; justify-content: center; gap: 4px;
              min-height: 40px; padding: 0 12px; border: 0.5px solid var(--dk-line-strong);
              border-radius: 10px; background: var(--dk-hover); color: var(--dk-ink);
